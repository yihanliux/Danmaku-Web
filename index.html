<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Player</title>
  <link rel="stylesheet" href="style.css?v=20260701-english-copy">
</head>
<body>
  <header class="experiment-toolbar" aria-label="Experiment setup controls">
    <div class="experiment-toolbar-inner">
      <div class="experiment-toolbar-title">Experiment Setup</div>
      <div class="experiment-toolbar-actions">
        <label class="select-button" for="videoInput">
          Select a Video
          <input
            id="videoInput"
            type="file"
            accept="video/mp4, video/webm, video/ogg, video/*"
          >
        </label>

        <div class="condition-control" aria-label="Experiment condition">
          <div class="condition-segmented" role="group" aria-label="Experiment condition">
            <button class="condition-button is-active" type="button" data-condition-id="baseline" aria-pressed="true">
              Baseline
            </button>
            <button class="condition-button" type="button" data-condition-id="on-device" aria-pressed="false">
              On-device
            </button>
            <button class="condition-button" type="button" data-condition-id="gesture-triggered" aria-pressed="false">
              Gesture
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="workspace">
      <section class="player" aria-label="Local video player">
        <header class="player-topbar">
          <div id="videoTitle" class="title-text">Please Select a Video</div>
        </header>

        <div class="screen">
          <div class="video-area">
            <video id="videoPlayer" preload="metadata">
              Your browser does not support the video tag.
            </video>
            <div id="danmakuLayer" class="danmaku-layer" aria-hidden="true"></div>
            <div id="placeholder" class="placeholder">No video selected</div>
          </div>
        </div>

        <div class="player-controls" aria-label="Video controls">
          <button id="playButton" class="icon-button" type="button" disabled aria-label="Play">
            <img id="playIcon" class="control-icon" src="src/play.png" alt="">
          </button>

          <span id="timeDisplay" class="time-text">00:00 / 00:00</span>

          <input
            id="progressBar"
            class="progress-bar"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            disabled
            aria-label="Video progress"
          >

          <button id="danmakuToggleButton" class="icon-button" type="button" aria-label="Danmaku on">
            <img id="danmakuToggleIcon" class="danmaku-control-icon" src="src/Danmaku open.png" alt="">
          </button>

          <div class="danmaku-settings-wrapper">
            <button id="danmakuSettingsButton" class="icon-button" type="button" aria-label="Danmaku settings">
              <img id="danmakuSettingsIcon" class="danmaku-control-icon" src="src/Danmaku Settings1.png" alt="">
            </button>
            <div id="danmakuSettingsPanel" class="danmaku-settings-panel hidden">
              <label class="danmaku-setting-row">
                <span class="danmaku-setting-label">Display Area</span>
                <span id="danmakuAreaValue" class="danmaku-setting-value">25%</span>
                <input id="danmakuAreaBar" class="danmaku-setting-bar" type="range" min="0" max="100" value="25">
              </label>

              <label class="danmaku-setting-row">
                <span class="danmaku-setting-label">Opacity</span>
                <span id="danmakuOpacityValue" class="danmaku-setting-value">60%</span>
                <input id="danmakuOpacityBar" class="danmaku-setting-bar" type="range" min="0" max="100" value="80">
              </label>

              <label class="danmaku-setting-row">
                <span class="danmaku-setting-label">Font Size</span>
                <span id="danmakuFontSizeValue" class="danmaku-setting-value">50%</span>
                <input id="danmakuFontSizeBar" class="danmaku-setting-bar" type="range" min="0" max="100" value="50">
              </label>

              <label class="danmaku-setting-row">
                <span class="danmaku-setting-label">Speed</span>
                <span id="danmakuSpeedValue" class="danmaku-setting-value">50%</span>
                <input id="danmakuSpeedBar" class="danmaku-setting-bar" type="range" min="0" max="100" value="50">
              </label>
            </div>
          </div>

          <div id="danmakuForm" class="danmaku-form danmaku-on" aria-label="Danmaku input">
            <button id="danmakuStyleButton" class="danmaku-style-button" type="button" aria-label="Danmaku style">
              <img class="danmaku-style-icon" src="src/Danmaku Style.png" alt="">
            </button>
            <input
              id="danmakuInput"
              class="danmaku-input"
              type="text"
              placeholder="Comment on this moment"
              autocomplete="off"
            >
            <button id="danmakuSendButton" class="danmaku-send-button" type="button">
              <span class="typing-send-default">Send</span>
              <span class="typing-send-hover-content" aria-hidden="true">
                <span>Send</span>
                <img class="typing-send-icon" src="src/Send_Typing.png" alt="">
              </span>
            </button>
          </div>

          <div class="volume-wrapper">
            <button id="voiceButton" class="icon-button" type="button" aria-label="Volume">
              <img class="control-icon" src="src/voice.png" alt="">
            </button>
            <div id="volumePanel" class="volume-panel hidden">
              <span id="volumePercent" class="volume-percent">100%</span>
              <input
                id="volumeBar"
                class="volume-bar"
                type="range"
                min="0"
                max="1"
                value="1"
                step="0.05"
                aria-label="Volume"
              >
            </div>
          </div>

          <button id="fullscreenButton" class="icon-button" type="button" aria-label="Full screen">
            <img class="control-icon" src="src/full screen.png" alt="">
          </button>
        </div>
      </section>

      <div class="shortcuts-column">
        <aside class="shortcuts-panel" aria-label="On-device danmaku shortcuts">
          <div class="shortcuts-header">
            <div class="shortcuts-title-row">
              <img class="shortcuts-title-icon" src="src/Danmaku.png" alt="">
              <h2 class="shortcuts-title">弹幕一键发送</h2>
            </div>
            <button id="shortcutLanguageButton" class="shortcut-language-button" type="button" aria-label="切换语言">
              <img class="shortcut-language-icon" src="src/language.png" alt="">
              <span id="shortcutLanguageText">中文-简体</span>
            </button>
          </div>
          <p id="shortcutSetupHint" class="shortcut-setup-hint">
            请选择最多 6 条偏好的弹幕，或自定义弹幕作为快捷弹幕。确认后即可一键发送。
          </p>
          <div class="shortcuts-buttons" aria-label="Shortcut buttons">
            <div class="shortcut-context-row shortcut-context-row-p" data-shortcut-group="P">
              <button class="shortcut-card-delete-button" type="button" aria-label="删除得分情境"><img class="shortcut-card-delete-icon" src="src/delete.png" alt=""></button>
              <span class="shortcut-context-label"><img class="shortcut-context-icon" src="src/得分.png" alt="">得分</span>
              <div class="shortcut-context-actions">
              <button class="shortcut-button shortcut-button-p" type="button" data-shortcut-group="P" data-danmaku-text="精彩"><span class="shortcut-default-text">精彩</span><span class="shortcut-hover-content" aria-hidden="true"><span>精彩</span><img class="shortcut-send-icon" src="src/Send_P.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-p" type="button" data-shortcut-group="P" data-danmaku-text="牛逼"><span class="shortcut-default-text">牛逼</span><span class="shortcut-hover-content" aria-hidden="true"><span>牛逼</span><img class="shortcut-send-icon" src="src/Send_P.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-p" type="button" data-shortcut-group="P" data-danmaku-text="太棒了"><span class="shortcut-default-text">太棒了</span><span class="shortcut-hover-content" aria-hidden="true"><span>太棒了</span><img class="shortcut-send-icon" src="src/Send_P.png" alt=""></span></button>
              <button class="shortcut-add-button shortcut-add-button-p" type="button" data-shortcut-group="P" aria-label="自定义得分弹幕"><span>自定义</span><img class="shortcut-add-icon" src="src/custom_P.png" alt=""></button>
              </div>
            </div>

            <div class="shortcut-context-row shortcut-context-row-n" data-shortcut-group="N">
              <button class="shortcut-card-delete-button" type="button" aria-label="删除失分情境"><img class="shortcut-card-delete-icon" src="src/delete.png" alt=""></button>
              <span class="shortcut-context-label"><img class="shortcut-context-icon" src="src/失分.png" alt="">失分</span>
              <div class="shortcut-context-actions">
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="可惜了"><span class="shortcut-default-text">可惜了</span><span class="shortcut-hover-content" aria-hidden="true"><span>可惜了</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="稳住"><span class="shortcut-default-text">稳住</span><span class="shortcut-hover-content" aria-hidden="true"><span>稳住</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="问题不大"><span class="shortcut-default-text">问题不大</span><span class="shortcut-hover-content" aria-hidden="true"><span>问题不大</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="差一点"><span class="shortcut-default-text">差一点</span><span class="shortcut-hover-content" aria-hidden="true"><span>差一点</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-add-button shortcut-add-button-n" type="button" data-shortcut-group="N" aria-label="自定义失分弹幕"><span>自定义</span><img class="shortcut-add-icon" src="src/custom_N.png" alt=""></button>
              </div>
            </div>

            <div class="shortcut-context-row shortcut-context-row-n" data-shortcut-group="N">
              <button class="shortcut-card-delete-button" type="button" aria-label="删除嘲讽情境"><img class="shortcut-card-delete-icon" src="src/delete.png" alt=""></button>
              <span class="shortcut-context-label"><img class="shortcut-context-icon" src="src/嘲讽.png" alt="">嘲讽</span>
              <div class="shortcut-context-actions">
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="就这？"><span class="shortcut-default-text">就这？</span><span class="shortcut-hover-content" aria-hidden="true"><span>就这？</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="拉完了"><span class="shortcut-default-text">拉完了</span><span class="shortcut-hover-content" aria-hidden="true"><span>拉完了</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="幽默"><span class="shortcut-default-text">幽默</span><span class="shortcut-hover-content" aria-hidden="true"><span>幽默</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-add-button shortcut-add-button-n" type="button" data-shortcut-group="N" aria-label="自定义嘲讽弹幕"><span>自定义</span><img class="shortcut-add-icon" src="src/custom_N.png" alt=""></button>
              </div>
            </div>

            <div class="shortcut-context-row shortcut-context-row-n" data-shortcut-group="N">
              <button class="shortcut-card-delete-button" type="button" aria-label="删除质疑情境"><img class="shortcut-card-delete-icon" src="src/delete.png" alt=""></button>
              <span class="shortcut-context-label"><img class="shortcut-context-icon" src="src/质疑.png" alt="">质疑</span>
              <div class="shortcut-context-actions">
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="啊？"><span class="shortcut-default-text">啊？</span><span class="shortcut-hover-content" aria-hidden="true"><span>啊？</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="裁判拉完了"><span class="shortcut-default-text">裁判拉完了</span><span class="shortcut-hover-content" aria-hidden="true"><span>裁判拉完了</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-n" type="button" data-shortcut-group="N" data-danmaku-text="离谱"><span class="shortcut-default-text">离谱</span><span class="shortcut-hover-content" aria-hidden="true"><span>离谱</span><img class="shortcut-send-icon" src="src/Send_N.png" alt=""></span></button>
              <button class="shortcut-add-button shortcut-add-button-n" type="button" data-shortcut-group="N" aria-label="自定义质疑弹幕"><span>自定义</span><img class="shortcut-add-icon" src="src/custom_N.png" alt=""></button>
              </div>
            </div>

            <div class="shortcut-context-row shortcut-context-row-i" data-shortcut-group="I">
              <button class="shortcut-card-delete-button" type="button" aria-label="删除等待情境"><img class="shortcut-card-delete-icon" src="src/delete.png" alt=""></button>
              <span class="shortcut-context-label"><img class="shortcut-context-icon" src="src/等待.png" alt="">等待</span>
              <div class="shortcut-context-actions">
              <button class="shortcut-button shortcut-button-i" type="button" data-shortcut-group="I" data-danmaku-text="紧张"><span class="shortcut-default-text">紧张</span><span class="shortcut-hover-content" aria-hidden="true"><span>紧张</span><img class="shortcut-send-icon" src="src/Send_I.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-i" type="button" data-shortcut-group="I" data-danmaku-text="窒息了"><span class="shortcut-default-text">窒息了</span><span class="shortcut-hover-content" aria-hidden="true"><span>窒息了</span><img class="shortcut-send-icon" src="src/Send_I.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-i" type="button" data-shortcut-group="I" data-danmaku-text="加油"><span class="shortcut-default-text">加油</span><span class="shortcut-hover-content" aria-hidden="true"><span>加油</span><img class="shortcut-send-icon" src="src/Send_I.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-i" type="button" data-shortcut-group="I" data-danmaku-text="求求了"><span class="shortcut-default-text">求求了</span><span class="shortcut-hover-content" aria-hidden="true"><span>求求了</span><img class="shortcut-send-icon" src="src/Send_I.png" alt=""></span></button>
              <button class="shortcut-add-button shortcut-add-button-i" type="button" data-shortcut-group="I" aria-label="自定义等待弹幕"><span>自定义</span><img class="shortcut-add-icon" src="src/custom_I.png" alt=""></button>
              </div>
            </div>

            <div class="shortcut-context-row shortcut-context-row-i" data-shortcut-group="I">
              <button class="shortcut-card-delete-button" type="button" aria-label="删除疑惑情境"><img class="shortcut-card-delete-icon" src="src/delete.png" alt=""></button>
              <span class="shortcut-context-label"><img class="shortcut-context-icon" src="src/疑惑.png" alt="">疑惑</span>
              <div class="shortcut-context-actions">
              <button class="shortcut-button shortcut-button-i" type="button" data-shortcut-group="I" data-danmaku-text="什么情况"><span class="shortcut-default-text">什么情况</span><span class="shortcut-hover-content" aria-hidden="true"><span>什么情况</span><img class="shortcut-send-icon" src="src/Send_I.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-i" type="button" data-shortcut-group="I" data-danmaku-text="没看清"><span class="shortcut-default-text">没看清</span><span class="shortcut-hover-content" aria-hidden="true"><span>没看清</span><img class="shortcut-send-icon" src="src/Send_I.png" alt=""></span></button>
              <button class="shortcut-button shortcut-button-i" type="button" data-shortcut-group="I" data-danmaku-text="?"><span class="shortcut-default-text">?</span><span class="shortcut-hover-content" aria-hidden="true"><span>?</span><img class="shortcut-send-icon" src="src/Send_I.png" alt=""></span></button>
              <button class="shortcut-add-button shortcut-add-button-i" type="button" data-shortcut-group="I" aria-label="自定义疑惑弹幕"><span>自定义</span><img class="shortcut-add-icon" src="src/custom_I.png" alt=""></button>
              </div>
            </div>

          </div>
          <button id="shortcutConfirmButton" class="shortcut-confirm-button" type="button" disabled>
            确认
          </button>
        </aside>
      </div>

      <div class="camera-column">
        <aside class="camera-panel" aria-label="Camera preview">
          <video id="cameraPreview" autoplay muted playsinline></video>
          <canvas id="handLandmarkCanvas" class="hand-landmark-canvas" aria-hidden="true"></canvas>
          <div id="cameraStatus" class="camera-status">Camera loading...</div>
          <div id="gestureStatus" class="gesture-status hidden">正在识别手势</div>
          <div id="gestureResult" class="gesture-result hidden">成功发送弹幕：厉害</div>
        </aside>
      </div>
    </div>
  </main>

  <dialog id="shortcutDialog" class="shortcut-dialog" aria-labelledby="shortcutDialogTitle">
    <form id="shortcutDialogForm" class="shortcut-dialog-form" novalidate>
      <h2 id="shortcutDialogTitle" class="shortcut-dialog-title">添加弹幕</h2>
      <input
        id="shortcutDialogInput"
        class="shortcut-dialog-input"
        type="text"
        autocomplete="off"
        placeholder="请输入新的弹幕"
        required
      >
      <p id="shortcutDialogError" class="shortcut-dialog-error" aria-live="polite"></p>
      <div class="shortcut-dialog-actions">
        <button id="shortcutDialogCancel" class="shortcut-dialog-cancel" type="button">取消</button>
        <button class="shortcut-dialog-confirm" type="submit">添加</button>
      </div>
    </form>
  </dialog>

  <script src="script.js?v=20260701-english-copy"></script>
</body>
</html>
